<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4a7dff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>学习助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #4a7dff;
    --primary-2: #6a9bff;
    --primary-soft: #eef3ff;
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #222222;
    --text-2: #666666;
    --text-3: #999999;
    --border: #e5e9f2;
    --border-2: #dfe4ef;
    --code-bg: #f4f6fb;
    --input-bg: #ffffff;
    --shadow: 0 4px 14px rgba(30, 60, 140, .08);
    --radius: 16px;
    --login-input-bg: #F5F7FA;
    --login-input-focus: #FFFFFF;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  body.theme-green  { --primary: #2e9e6b; --primary-2: #58c08c; --primary-soft: #e6f6ee; --bg: #f2f9f5; --shadow: 0 4px 14px rgba(30, 110, 80, .10); }
  body.theme-dark   { --primary: #7aa2ff; --primary-2: #9dbdff; --primary-soft: #1d2a44; --bg: #12151c; --card: #1c212c; --text: #e6e9f0; --text-2: #a0a8b8; --text-3: #7c8494; --border: #2a3140; --border-2: #333b4c; --code-bg: #262d3b; --input-bg: #1c212c; --shadow: 0 4px 14px rgba(0, 0, 0, .35); --login-input-bg: #1c212c; --login-input-focus: #222a38; }
  body.theme-pink   { --primary: #ff6b9d; --primary-2: #ff8fb5; --primary-soft: #ffe9f1; --bg: #fff5f8; --shadow: 0 4px 14px rgba(255, 100, 150, .12); }
  body.theme-warm   { --primary: #e8a33d; --primary-2: #f7c948; --primary-soft: #fdf1dd; --bg: #fffaf0; --shadow: 0 4px 14px rgba(200, 140, 30, .12); }
  body.theme-minimal{ --primary: #333333; --primary-2: #555555; --primary-soft: #f2f2f2; --bg: #ffffff; --border: #eeeeee; --border-2: #e5e5e5; --code-bg: #f7f7f7; --shadow: 0 2px 10px rgba(0, 0, 0, .05); }

  header { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); position: relative; z-index: 20; }
  main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  main::-webkit-scrollbar, .submenu::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb, .submenu::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 15px; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .msg.bot .bubble h1 { font-size: 17px; margin: 8px 0 4px; }
  .msg.bot .bubble h2 { font-size: 16px; margin: 8px 0 4px; color: var(--primary); }
  .msg.bot .bubble h3 { font-size: 15px; margin: 8px 0 4px; }
  .msg.bot .bubble h4 { font-size: 14px; margin: 6px 0 3px; }
  .msg.bot .bubble p { margin: 4px 0; }
  .msg.bot .bubble ul, .msg.bot .bubble ol { margin: 4px 0 4px 18px; padding: 0; }
  .msg.bot .bubble li { margin: 2px 0; }
  .msg.bot .bubble pre { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
  .msg.bot .bubble code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg.bot .bubble a { color: var(--primary); text-decoration: underline; word-break: break-all; }
  .msg.bot .bubble pre code { background: none; padding: 0; }
  .msg.bot .bubble table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 13px; }
  .msg.bot .bubble th, .msg.bot .bubble td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg.bot .bubble th { background: var(--primary-soft); }
  .msg.bot .bubble hr { border: none; border-top: 1px dashed var(--border); margin: 8px 0; }
  .bubble.typing { color: var(--text-3); }
  .wbar { display: flex; background: var(--card); border-top: 1px solid var(--border); }
  .wbtn { flex: 1; padding: 11px 0; border: none; background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; border-right: 1px solid var(--border); transition: color .15s; }
  .wbtn:last-child { border-right: none; }
  .wbtn.active { color: var(--primary); font-weight: 600; }
  .submenu { background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0, 0, 0, .05); max-height: 240px; overflow-y: auto; }
  .submenu button { display: block; width: 100%; text-align: left; padding: 11px 16px; border: none; background: var(--card); color: var(--text); font-size: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .submenu button:active { background: var(--primary-soft); }
  .option-box { display: flex; flex-wrap: wrap; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; max-width: 82%; box-shadow: var(--shadow); }
  .opt-btn { padding: 8px 14px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); font-size: 14px; border: none; cursor: pointer; transition: transform .12s, filter .12s; }
  .opt-btn:active { transform: scale(.96); filter: brightness(.95); }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: var(--card); border-top: 1px solid var(--border); }
  #input { flex: 1; border: 1px solid var(--border-2); border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none; background: var(--input-bg); color: var(--text); }
  #input:focus { border-color: var(--primary); }
  #send { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; border-radius: 20px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  #attach { background: var(--primary-soft); color: var(--primary); border: none; border-radius: 20px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  .login { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .18), transparent 60%), linear-gradient(180deg, var(--primary), var(--primary-2)); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--card); color: var(--text); border-radius: 20px; padding: 34px 26px 26px; width: 84%; max-width: 350px; max-height: calc(100vh - 24px); overflow-y: auto; text-align: center; box-shadow: 0 18px 48px rgba(0, 0, 0, .22); }
  .login-card h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: #8890A6; font-size: 13px; margin-bottom: 24px; }
  .login-field { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
  .login-field .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-2); opacity: .65; pointer-events: none; z-index: 1; }
  .field-input-wrap { position: relative; flex: 1; min-width: 0; }
  .login-card input { width: 100%; flex: 1; min-width: 0; font-family: inherit; font-weight: 400; border: 1px solid transparent; border-radius: 12px; padding: 12px 14px 12px 44px; font-size: 15px; outline: none; background: var(--login-input-bg) !important; color: var(--text) !important; -webkit-text-fill-color: var(--text); caret-color: var(--text); transition: box-shadow .2s, border-color .2s, background .2s; }
  .login-card input:focus { background: var(--login-input-focus) !important; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 125, 255, .15); }
  .login-card input:-webkit-autofill,
  .login-card input:-webkit-autofill:hover,
  .login-card input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--login-input-bg) inset !important;
    box-shadow: 0 0 0 1000px var(--login-input-bg) inset !important;
    background-color: var(--login-input-bg) !important;
    -webkit-text-fill-color: var(--text);
    caret-color: var(--text);
  }
  #password { padding-right: 52px; color: var(--text) !important; -webkit-text-fill-color: var(--text) !important; }
  .pwd-eye { position: absolute !important; right: 5px !important; top: 50% !important; transform: translateY(-50%) !important; width: 30px !important; height: 30px !important; min-width: 30px !important; max-width: 30px !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; border: none !important; background: none !important; box-shadow: none !important; padding: 0 !important; font-size: 15px !important; line-height: 1 !important; cursor: pointer !important; border-radius: 50% !important; color: var(--text-2) !important; z-index: 1 !important; transition: color .2s, background .2s !important; }
  .pwd-eye.showing { color: var(--primary); }
  .pwd-eye:active { background: rgba(0, 0, 0, .06); }
  .field-error { color: #e5484d; font-size: 12px; text-align: left; margin: -6px 0 10px 40px; }
  .remember-row { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 18px; font-size: 12px; color: var(--text-2); }
  .remember-row label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch { width: 34px; height: 20px; border-radius: 10px; background: #d5dbe8; position: relative; display: inline-block; flex: 0 0 auto; transition: background .2s; }
  .switch::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  .remember-row input:checked + .switch { background: var(--primary); }
  .remember-row input:checked + .switch::after { left: 16px; }
  .login-card button { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
  .login-card button:disabled { opacity: .7; cursor: default; }
  .login-card button:active { transform: scale(.98); }
  .login-toggle { margin-top: 14px; font-size: 13px; color: var(--text-2); }
  .login-toggle span { color: var(--primary); cursor: pointer; font-weight: 600; }
  @media (max-width: 380px), (max-height: 680px) {
    .login { padding: 16px 0; }
    .login-card { padding: 22px 18px 18px; max-height: calc(100vh - 20px); }
    .login-mascot { width: 60px; height: 60px; margin-bottom: 10px; }
    .login-card h1 { font-size: 16px; }
    .login-sub { margin-bottom: 14px; }
    .login-field { margin-bottom: 10px; }
    .login-card input { padding: 11px 12px 11px 42px; font-size: 14px; }
  }
  .hidden { display: none !important; }
  #logout, #themeBtn { margin-left: auto; background: rgba(255, 255, 255, .2); border: none; color: #fff; border-radius: 12px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #themeBtn { margin-left: 0; font-size: 15px; }

  .quiz-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; max-width: 94%; width: 94%; box-shadow: var(--shadow); }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }
  .quiz-progress { font-weight: 600; color: var(--primary); }
  .quiz-q { background: var(--primary-soft); border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .quiz-opt { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .quiz-opt button { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--input-bg); color: var(--text); font-size: 14px; cursor: pointer; transition: transform .12s; }
  .quiz-opt button:active { transform: scale(.98); }
  .quiz-opt button.sel { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: var(--primary); }
  .quiz-q-input { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 12px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text); }
  .quiz-sheet { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 10px 0; }
  .quiz-sheet button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border-2); background: var(--input-bg); color: var(--text); font-size: 12px; cursor: pointer; position: relative; transition: transform .1s; }
  .quiz-sheet button:active { transform: scale(.92); }
  .quiz-sheet button.answered { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: var(--primary); }
  .quiz-sheet button.marked { background: #ffd54a; color: #222; border-color: #f0b400; }
  .quiz-sheet button.current { outline: 2px solid #ff6b6b; }
  .quiz-sheet button.marked::after { content: '?'; position: absolute; top: -5px; right: -2px; font-size: 10px; }
  .quiz-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-ctrl button { flex: 1; min-width: 78px; padding: 8px 6px; border-radius: 10px; border: none; background: var(--primary-soft); color: var(--primary); font-size: 13px; cursor: pointer; }
  .quiz-ctrl button.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
  .quiz-ctrl button:disabled { opacity: .4; cursor: default; }

  .theme-panel { position: fixed; right: 12px; top: 54px; z-index: 50; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }
  .theme-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 12px; cursor: pointer; }
  .theme-item.active { outline: 2px solid var(--primary); }
  .theme-swatch { display: flex; gap: 3px; }
  .theme-swatch i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }

  /* ===== Coze 风格布局 ===== */
  .layout { display: flex; height: 100vh; min-height: 0; }
  .sidebar { display: none; width: 220px; background: var(--card); border-right: 1px solid var(--border); flex-direction: column; }
  .sidebar-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; font-size: 16px; font-weight: 700; color: var(--text); }
  .sidebar-head .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .sidebar-nav { flex: 1; padding: 2px 10px 10px; overflow-y: auto; }
  .sidebar-group { padding: 14px 12px 6px; font-size: 12px; color: var(--text-3); }
  .sidebar-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent; color: var(--text); font-size: 13.5px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
  .sidebar-item:hover { background: var(--primary-soft); color: var(--primary); }
  .sidebar-item:active { background: var(--primary-soft); }
  .sidebar-foot { padding: 14px 16px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border); }
  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: var(--card); color: var(--text); border-bottom: 1px solid var(--border); box-shadow: none; padding: 12px 18px; }
  #logout, #themeBtn { background: var(--primary-soft); color: var(--primary); }
  main { max-width: 860px; width: 100%; margin: 0 auto; padding: 18px 16px; }
  .msg.bot { align-items: flex-start; gap: 8px; }
  .msg.bot::before { content: '📚'; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; margin-top: 2px; }
  .msg.bot .bubble { max-width: calc(82% - 38px); border-radius: 16px 16px 16px 4px; }
  .msg.user .bubble { border-radius: 16px 16px 4px 16px; }
  .option-box { max-width: calc(82% - 38px); }
  .quiz-box { max-width: calc(94% - 38px); width: calc(94% - 38px); }
  footer { max-width: 860px; width: 100%; margin: 0 auto; background: transparent; border-top: none; padding: 10px 16px 14px; gap: 8px; }
  #input { border-radius: 22px; padding: 11px 16px; box-shadow: var(--shadow); }
  #attach { border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; padding: 0; font-size: 17px; }
  #speakBtn { border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; padding: 0; font-size: 17px; background: var(--primary-soft); color: var(--primary); border: none; cursor: pointer; }
  #send { border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; padding: 0; font-size: 16px; }
  @media (min-width: 900px) {
    .sidebar { display: flex; }
    .wbar { display: none; }
  }

  /* ===== B端管理后台风格 ===== */
  .sidebar { width: 240px; }
  .sidebar-search { padding: 0 12px 8px; }
  .sidebar-search input { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 8px 12px; font-size: 13px; outline: none; background: var(--input-bg); color: var(--text); }
  .sidebar-search input:focus { border-color: var(--primary); }
  .storage-pill { display: flex; align-items: center; gap: 8px; margin: 10px 12px; padding: 8px 12px; border-radius: 20px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600; }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .user-info { line-height: 1.3; }
  .user-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .user-status { font-size: 11px; color: #2e9e6b; }
  header { justify-content: space-between; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 8px 14px; border-radius: 10px; border: none; background: transparent; color: var(--text-2); font-size: 14px; cursor: pointer; transition: background .15s, color .15s; }
  .tab.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .file-view { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .file-table { max-width: 860px; width: 100%; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .file-row { display: grid; grid-template-columns: 3fr 1.2fr 1fr 1.4fr 1.8fr; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); }
  .file-row:last-child { border-bottom: none; }
  .file-head { background: var(--primary-soft); color: var(--text-2); font-weight: 600; font-size: 12px; }
  .file-name { display: flex; align-items: center; gap: 8px; font-weight: 600; word-break: break-all; }
  .file-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--primary-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; flex: 0 0 30px; }
  .file-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .file-actions button { padding: 4px 8px; border: none; border-radius: 8px; background: var(--primary-soft); color: var(--primary); font-size: 12px; cursor: pointer; }
  .file-actions button.danger { background: #ffe9e9; color: #e5484d; }
  .file-empty { padding: 40px 16px; text-align: center; color: var(--text-3); font-size: 13px; }
  @media (max-width: 700px) {
    .file-row { grid-template-columns: 2fr 1fr 1.2fr; }
    .file-row > span:nth-child(4) { display: none; }
  }

  /* ===== 技能市场 ===== */
  .sidebar-foot { padding: 0; }
  .progress-block { padding: 12px 16px 8px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .progress-track { height: 8px; border-radius: 4px; background: var(--code-bg); overflow: hidden; }
  .progress-bar { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); transition: width .5s; }
  .upgrade-banner { margin: 10px 12px; padding: 8px 12px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 12px; font-weight: 600; }
  .file-view-head { display: flex; justify-content: space-between; align-items: center; max-width: 860px; width: 100%; margin: 0 auto 10px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .file-view-head .storage-pill { margin: 0; }
  .market-view { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .market-container { max-width: 1200px; width: 100%; margin: 0 auto; }
  .market-search-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .market-search { display: flex; align-items: center; gap: 8px; background: var(--input-bg); border: 1px solid var(--border-2); border-radius: 20px; padding: 8px 14px; width: 260px; }
  .market-search input { border: none; outline: none; flex: 1; background: transparent; color: var(--text); font-size: 13px; }

<script>
const $ = s => document.querySelector(s);

let autoScroll = true;
let currentUser = null;
const APP_VERSION = '1.0.0';

function updateScrollDown(){
  const m = $('#messages');
  const dist = m.scrollHeight - m.scrollTop - m.clientHeight;
  if (dist > 80){
    $('#scrollDown').classList.remove('hidden');
  } else {
    $('#scrollDown').classList.add('hidden');
  }
}

function scrollToBottom(){
  if (autoScroll){
    $('#messages').scrollTop = $('#messages').scrollHeight;
    updateScrollDown();
  }
}

function forceScrollToBottom(){
  autoScroll = true;
  $('#messages').scrollTop = $('#messages').scrollHeight;
  updateScrollDown();
}

function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  const nameEl = document.querySelector('.user-name');
  if (nameEl && currentUser) nameEl.textContent = currentUser.username || '我的学伴';
  $('#input').focus();
}

function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineFormat(s){
  return s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
}

function renderMarkdown(text){
  const lines = escapeHtml(text).split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (/^```/.test(line.trim())){
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + code.join('\n') + '</code></pre>');
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h){
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inlineFormat(h[2]) + '</h' + lv + '>');
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i].trim()); i++; }
      const parseRow = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inlineFormat(c.trim()));
      const header = parseRow(rows[0]);
      let t = '<table><thead><tr>' + header.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
      for (let r = 2; r < rows.length; r++){
        t += '<tr>' + parseRow(rows[r]).map(x => '<td>' + x + '</td>').join('') + '</tr>';
      }
      out.push(t + '</tbody></table>');
      continue;
    }
    if (/^\s*[-•]\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^[-•]\s+/.test(t)){
          items.push('<li>' + inlineFormat(t.replace(/^[-•]\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^\d+\.\s+/.test(t)){
          const num = parseInt(t, 10);
          items.push('<li value="' + num + '">' + inlineFormat(t.replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ol>' + items.join('') + '</ol>');
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() !== '' && !/^```/.test(lines[i].trim()) && !/^#{1,4}\s/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*[-•]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      para.push(inlineFormat(lines[i].trim()));
      i++;
    }
    if (para.length){ out.push('<p>' + para.join('<br>') + '</p>'); }
    else { i++; }
  }
  return out.join('');
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (who === 'bot'){ b.innerHTML = renderMarkdown(text); }

}

function typingHint(text){
  const t = (text || '').trim();
  if (t.startsWith('/test')) return '正在生成题目，通常需要 20-40 秒…';
  if (t.startsWith('/cards')) return '正在提炼知识点和背诵卡片…';
  if (t.startsWith('/plan')) return '正在生成学习计划…';
  if (t.startsWith('/daily')) return '正在拆分每日任务…';
  if (t.startsWith('/explain')) return 'AI 老师思考中…';
  if (t.startsWith('/polish') || t.startsWith('/改写')) return '正在润色文本…';
  if (t.startsWith('/rebuild')) return '正在重建知识库，可能需要几分钟…';
  if (t.startsWith('/merge')) return '正在合并归档…';
  return '正在思考…';
}

function addTyping(hint){
  const div = document.createElement('div');
  div.className = 'msg bot';
  const b = document.createElement('div');
  b.className = 'bubble typing';
  div._base = hint || '正在思考…';
  b.textContent = div._base;
  let sec = 0;
  div._timer = setInterval(() => {
    sec++;
    b.textContent = div._base + '（⏱ ' + sec + 's）';
  }, 1000);
  div.appendChild(b);
  $('#messages').appendChild(div);
  scrollToBottom();
  return div;
}

function removeTyping(el){
  if (el && el._timer) clearInterval(el._timer);
  if (el) el.remove();
}

async function safeJson(r){
  try { return await r.json(); } catch (e) { return null; }
}

async function pollTask(taskId, hint){
  const typing = addTyping(hint);
  let tries = 0;
  try {
    while (tries < 600) {
      tries += 1;
      const r = await fetch('/api/task?task_id=' + encodeURIComponent(taskId));
      const d = await safeJson(r);
      if (r.status === 401) {
        const st = await fetch('/api/status').then(x => x.json()).catch(() => null);
        if (st && st.need_login && !st.authed){
          removeTyping(typing);
          showLogin();
          return null;
        }
        continue;
      }
      if (d && d.status === 'done') { removeTyping(typing); return d; }
      if (d && !d.ok) { removeTyping(typing); addMsg('❌ ' + (d.error || '任务失败'), 'bot'); return null; }
      await new Promise(res => setTimeout(res, 1500));
    }
    removeTyping(typing);
    addMsg('❌ 任务处理超时（超过15分钟），请重试', 'bot');
    return null;
  } catch (e) {
    removeTyping(typing);
    addMsg('❌ 网络错误：' + e.message, 'bot');
    return null;
  }
}

async function runChat(text){
  autoScroll = true;
  $('#scrollDown').classList.add('hidden');
  if (!text.startsWith('/explain')) pendingExplainPick = null;
  addMsg(text, 'user');
  const hint = typingHint(text);
  const typing = addTyping(hint);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, conversation_id: currentConvId})
    });
    const d = await safeJson(r);
    removeTyping(typing);
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok || !d.task_id) { addMsg('❌ ' + (d.error || '发送失败'), 'bot'); return; }
    const result = await pollTask(d.task_id, hint);
    if (!result) return;
    const autoQuiz = pendingQuizAid;
    pendingQuizAid = null;
    if (!autoQuiz) addMsg(result.reply, 'bot');
    if (result.options){
      const opts = autoQuiz ? result.options.filter(o => !(o.payload && o.payload.step === 'quiz')) : result.options;
      if (opts.length) renderOptions(opts);
    }
    if (autoQuiz) openQuiz(autoQuiz);
    refreshConvs();
  } catch (e) {
    removeTyping(typing);
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function send(){
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const m = text.match(/^\/(say|读|朗读)\s+(.+)$/i);
  if (m){
    addMsg(text, 'user');
    speakText(m[2]);
    return;
  }
  runChat(text);
}

async function fetchOptions(body){
  const typing = addTyping();
  try {
    const r = await fetch('/api/options', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await safeJson(r);
    removeTyping(typing);
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok) { addMsg('❌ ' + (d.error || '出错了'), 'bot'); return; }
    if (d.prompt) addMsg(d.prompt, 'bot');
    renderOptions(d.options);
    if (d.run) runChat(d.run);
  } catch (e) {
    removeTyping(typing);
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function renderOptions(options){
  if (!options || !options.length) return;
  const div = document.createElement('div');
  div.className = 'msg bot';
  const box = document.createElement('div');
  box.className = 'option-box';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o.label;
    b.addEventListener('click', () => {
      if (o.payload && o.payload.step === 'quiz') {
        openQuiz(o.payload.aid);
      } else if (o.payload && o.payload.step === 'run') {
        if (o.payload.autoQuiz) pendingQuizAid = o.payload.autoQuiz;
        if (o.payload.cmd && o.payload.cmd.startsWith('/explain')){
          const p = o.payload.cmd.split(/\s+/);
          pendingExplainPick = p[2] ? parseInt(p[2], 10) : null;
        }
        runChat(o.payload.cmd);
      } else {
        fetchOptions(o.payload);
      }
    });
    box.appendChild(b);
  });
  div.appendChild(box);
  $('#messages').appendChild(div);
  scrollToBottom();
}

let quizState = null;
let pendingQuizAid = null;
let pendingExplainPick = null;

function cleanQuestionText(text){
  let t = text || '';
  // 去掉行首编号和加粗标记：**1. xxx** -> xxx
  t = t.replace(/^\s*\*{0,2}\s*\d{1,3}\s*[.、．:：]\s*\*{0,2}/, '');
  // 去掉 A. / B、 等选项行（选项会在下方单独显示，避免重复）
  t = t.split('\n').filter(line => !/^\s*\*{0,2}[A-Da-d]\s*[.、．)）]/.test(line)).join('\n');
  // 清理残余的整行加粗星号
  t = t.replace(/^\s*\*\*\s*$/gm, '');
  // 兜底：去掉所有残余星号，避免 ** 裸显示
  t = t.replace(/\*/g, '');
  return t.trim();
}

function quizSaveLocal(st){
  try { localStorage.setItem('quiz_' + st.aid, JSON.stringify({answers: st.answers, marked: st.marked})); } catch(e){}
}

function quizSaveServer(st){
  fetch('/api/quiz_save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({aid: st.aid, answers: st.answers, marked: st.marked})
  }).catch(() => {});
}

function quizSave(st){
  quizSaveLocal(st);
  quizSaveServer(st);
}

function renderQuiz(st){
  quizState = st;
  const isNew = !st.wrap;
  let wrap = st.wrap;
  if (!wrap){
    wrap = document.createElement('div');
    wrap.className = 'msg bot';
    st.wrap = wrap;
    $('#messages').appendChild(wrap);
  } else {
    wrap.innerHTML = '';
  }
  const box = document.createElement('div');
  box.className = 'quiz-box';

  const total = st.questions.length;
  const answered = st.questions.filter(q => (st.answers[q.no] || '').trim() !== '').length;
  const q = st.questions[st.current];

  const head = document.createElement('div');
  head.className = 'quiz-head';
  head.innerHTML = '<span>📝 答题模式｜归档ID ' + st.aid + '</span><span class="quiz-progress">已答 ' + answered + '/' + total + '</span>';
  box.appendChild(head);
  if (pendingExplainPick !== null){
    const hint = document.createElement('div');
    hint.className = 'quiz-explain-hint';
    hint.textContent = '🤔 AI讲题模式：点击下方答题卡上的题号，即可选择要讲解的题目';
    box.appendChild(hint);
  }

  const qbox = document.createElement('div');
  qbox.className = 'quiz-q';
  qbox.innerHTML = '<b>第' + q.no + '题：</b>' + renderMarkdown(cleanQuestionText(q.text));
  box.appendChild(qbox);

  const optWrap = document.createElement('div');
  optWrap.className = 'quiz-opt';
  if (q.options && q.options.length){
    q.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.key + '. ' + o.text;
      if ((st.answers[q.no] || '').toUpperCase() === o.key) b.classList.add('sel');
      b.addEventListener('click', () => {
        st.answers[q.no] = o.key;
        quizSave(st);
        renderQuiz(st);
      });
      optWrap.appendChild(b);
    });
  } else {
    const inp = document.createElement('input');
    inp.className = 'quiz-q-input';
    inp.placeholder = '简答题：输入你的回答（不会自动批改）';
    inp.value = st.answers[q.no] || '';
    inp.addEventListener('change', () => {
      st.answers[q.no] = inp.value.trim();
      quizSave(st);
    });
    optWrap.appendChild(inp);
  }
  box.appendChild(optWrap);

  const sheet = document.createElement('div');
  sheet.className = 'quiz-sheet';
  st.questions.forEach((qq, idx) => {
    const b = document.createElement('button');
    b.textContent = qq.no;
    if ((st.answers[qq.no] || '').trim()) b.classList.add('answered');
    if (st.marked.includes(qq.no)) b.classList.add('marked');
    if (idx === st.current) b.classList.add('current');
    b.title = '第' + qq.no + '题';
    b.addEventListener('click', () => {
      if (pendingExplainPick !== null){
        const n = pendingExplainPick;
        pendingExplainPick = null;
        runChat(String(qq.no));
      } else {
        st.current = idx;
        renderQuiz(st);
      }
    });
    sheet.appendChild(b);
  });
  box.appendChild(sheet);

  const ctrl = document.createElement('div');
  ctrl.className = 'quiz-ctrl';
  const btnPrev = document.createElement('button');
  btnPrev.textContent = '⬅ 上一题';
  btnPrev.disabled = st.current <= 0;
  btnPrev.addEventListener('click', () => { st.current = Math.max(0, st.current - 1); renderQuiz(st); });
  const btnNext = document.createElement('button');
  btnNext.textContent = '下一题 ➡';
  btnNext.addEventListener('click', () => { st.current = Math.min(total - 1, st.current + 1); renderQuiz(st); });
  const btnMark = document.createElement('button');
  btnMark.textContent = st.marked.includes(q.no) ? '取消标记 ⚑' : '标记本题 ⚑';
  btnMark.addEventListener('click', () => {
    const idx = st.marked.indexOf(q.no);
    if (idx >= 0) st.marked.splice(idx, 1); else st.marked.push(q.no);
    quizSave(st);
    renderQuiz(st);
  });
  const btnSave = document.createElement('button');
  btnSave.textContent = '💾 保存进度';
  btnSave.addEventListener('click', () => {
    quizSave(st);
    addMsg('✅ 答题进度已保存，下次打开可继续', 'bot');
  });
  const btnSubmit = document.createElement('button');
  btnSubmit.className = 'primary';
  btnSubmit.textContent = '✅ 提交批改';
  btnSubmit.addEventListener('click', () => submitQuiz(st, box));
  ctrl.appendChild(btnPrev);
  ctrl.appendChild(btnNext);
  ctrl.appendChild(btnMark);
  ctrl.appendChild(btnSave);
  ctrl.appendChild(btnSubmit);
  box.appendChild(ctrl);

  wrap.appendChild(box);
  if (isNew) scrollToBottom();
}

async function submitQuiz(st, box){
  const answers = {};
  st.questions.forEach(qq => {
    const v = (st.answers[qq.no] || '').trim();
    if (v) answers[qq.no] = v;
  });
  quizSaveLocal(st);
  try {
    const r = await fetch('/api/quiz_submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({aid: st.aid, answers: answers})
    });
    let d = null;
    try { d = await r.json(); } catch(e){ d = null; }
    if (!d){ addMsg('❌ 服务器响应异常（可能处理超时），请稍后重试', 'bot'); return; }
    if (!d.ok){ addMsg('❌ ' + (d.error || '提交失败'), 'bot'); return; }
    if (st.wrap) st.wrap.remove();
    addMsg(d.reply, 'bot');
    if (d.options) renderOptions(d.options);
  } catch(e){
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

async function openQuiz(aid){
  try {
    const r = await fetch('/api/quiz?aid=' + encodeURIComponent(aid));
    let d = null;
    try { d = await r.json(); } catch(e){ d = null; }
    if (!d){ addMsg('❌ 服务器响应异常（可能处理超时），请稍后重试', 'bot'); return; }
    if (!d.ok){ addMsg('❌ ' + (d.error || '加载失败'), 'bot'); return; }
    let answers = {};
    let marked = [];
    try {
      const rr = await fetch('/api/quiz_resume?aid=' + encodeURIComponent(aid));
      let rd = null;
      try { rd = await rr.json(); } catch(e){ rd = null; }
      if (rd.ok){ answers = rd.answers || {}; marked = rd.marked || []; }
    } catch(e){}
    try {
      const local = localStorage.getItem('quiz_' + aid);
      if (local){
        const ls = JSON.parse(local);
        answers = ls.answers || answers;
        marked = ls.marked || marked;
      }
    } catch(e){}
    const st = {aid: aid, questions: d.questions, answers: answers, marked: marked, current: 0};
    renderQuiz(st);
    addMsg('🖊 答题卡已打开：点选项作答会变蓝，标记会变黄，切换/保存进度都不会丢失', 'bot');
  } catch(e){
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function fmtSize(n){
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function fmtTime(ts){
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function fileIcon(name){
  const n = (name || '').toLowerCase();
  if (n.endsWith('.pdf')) return '📕';
  if (n.endsWith('.docx') || n.endsWith('.doc')) return '📘';
  if (n.endsWith('.pptx')) return '📙';
  if (/\.(jpg|jpeg|png|bmp|webp)$/.test(n)) return '🖼️';
  if (n.startsWith('【合并】')) return '🗂️';
  return '📄';
}

async function loadFiles(){
  try {
    const r = await fetch('/api/files');
    const d = await r.json();
    if (!d || !d.ok) return;
    $('#storagePill').textContent = '📦 ' + fmtSize(d.total_size || 0) + ' / 50 GB';
    const list = $('#fileList');
    list.innerHTML = '';
    const files = d.files || [];
    $('#fileEmpty').classList.toggle('hidden', files.length > 0);
    files.forEach(f => {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML =
        '<span class="file-name"><span class="file-icon">' + fileIcon(f.filename) + '</span><span>' + escapeHtml(f.filename) + '</span></span>' +
        '<span>' + escapeHtml(f.subject) + '</span>' +
        '<span>' + fmtSize(f.size) + '</span>' +
        '<span>' + fmtTime(f.create_ts) + '</span>' +
        '<span class="file-actions">' +
          '<button data-act="cards">📇 卡片</button>' +
          '<button data-act="test">📝 自测</button>' +
          '<button data-act="del" class="danger">🗑 删除</button>' +
        '</span>';
      row.querySelector('[data-act="cards"]').addEventListener('click', () => { switchTab('chat'); runChat('/cards id ' + f.id); });
      row.querySelector('[data-act="test"]').addEventListener('click', () => { switchTab('chat'); runChat('/test id ' + f.id); });
      row.querySelector('[data-act="del"]').addEventListener('click', () => {
        if (window.confirm('确认删除归档ID ' + f.id + '（' + f.filename + '）？删除后不可恢复')) {
          switchTab('chat');
          runChat('/del id ' + f.id);
        }
      });
      list.appendChild(row);
    });
    const kw = fileSearchKw;
    const rows = document.querySelectorAll('#fileList .file-row');
    let shown = 0;
    rows.forEach(row => {
      const hit = kw === '' || row.textContent.toLowerCase().includes(kw);
      row.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    $('#fileEmpty').classList.toggle('hidden', shown > 0);
  } catch(e){}
}

let currentConvId = null;
let convsCache = [];

function renderConvList(convs){
  const lists = [$('#convList'), $('#drawerConvList')];
  lists.forEach(list => {
    if (!list) return;
    list.innerHTML = '';
    convs.forEach(c => {
      const row = document.createElement('div');
      row.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
      row.dataset.cid = c.id;
      const label = document.createElement('button');
      label.className = 'conv-item-label';
      label.textContent = (c.title || '新对话') + ' · ' + (c.count || 0);
      label.title = c.title || '新对话';
      label.addEventListener('click', () => { closeDrawer(); openConversation(c.id); });
      const del = document.createElement('button');
      del.className = 'conv-del';
      del.textContent = '🗑';
      del.title = '删除对话';
      del.addEventListener('click', (e) => { e.stopPropagation(); deleteConversation(c.id, del); });
      row.appendChild(label);
      row.appendChild(del);
      list.appendChild(row);
    });
  });
}

async function deleteConversation(cid, btn){
  // 两步确认：第一次点击变为“确认?”，3秒内再点才真正删除（避免弹窗被拦截）
  if (!btn || btn.dataset.arm !== '1'){
    if (btn){
      btn.dataset.arm = '1';
      btn.textContent = '确认?';
      btn.classList.add('arming');
      setTimeout(() => {
        btn.textContent = '🗑';
        btn.dataset.arm = '';
        btn.classList.remove('arming');
      }, 3000);
    }
    return;
  }
  btn.dataset.arm = '';
  try {
    const r = await fetch('/api/conversations/' + encodeURIComponent(cid), {method: 'DELETE'});
    const d = await r.json();
    if (!d || !d.ok){ addMsg('❌ ' + ((d && d.error) || '删除失败'), 'bot'); return; }
    addMsg('🗑 对话已删除（误删可发送 /restore ' + cid + ' 找回）', 'bot');
    const wasCurrent = currentConvId === cid;
    if (wasCurrent){
      currentConvId = null;
      $('#messages').innerHTML = '';
    }
    await loadConversations();
  } catch(e){
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

async function loadConversations(){
  try {
    const r = await fetch('/api/conversations');
    const d = await r.json();
    if (!d || !d.ok) return;
    convsCache = d.conversations || [];
    renderConvList(convsCache);
    if (!currentConvId){
      if (convsCache.length){
        await openConversation(convsCache[0].id);
      } else {
        await newConversation();
      }
    }
  } catch(e){}
}

async function newConversation(){
  try {
    const r = await fetch('/api/conversations', {method: 'POST'});
    const d = await r.json();
    if (!d || !d.ok) return;
    currentConvId = d.conversation.id;

    addMsg('👋 新对话已开始，可以上传资料或直接提问', 'bot');

}

async function openConversation(cid){
  try {
    const r = await fetch('/api/conversations/' + encodeURIComponent(cid));

async function loadMarket(){

function renderMarketChips(){
  const chipBox = $('#marketChips');
  chipBox.innerHTML = '';
  const tags = ['全部'];
  (marketData.packages || []).concat(marketData.datasets || []).forEach(it => {
    (it.tags || []).forEach(t => { if (tags.indexOf(t) < 0) tags.push(t); });
  });
  tags.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip' + (marketFilter === t ? ' active' : '');
    b.textContent = t;
    b.addEventListener('click', () => { marketFilter = t; renderMarketChips(); renderMarket(); });
    chipBox.appendChild(b);
  });
}

function renderMarket(){
  const box = $('#marketSections');
  box.innerHTML = '';
  const kw = marketKw;
  const match = it => {
    if (kw && (it.title + ' ' + (it.desc || '') + ' ' + (it.tags || []).join(' ')).toLowerCase().indexOf(kw) < 0) return false;
    if (marketFilter && marketFilter !== '全部' && (it.tags || []).indexOf(marketFilter) < 0) return false;
    return true;
  };
  const pkgs = (marketData.packages || []).filter(match);
  const dss = (marketData.datasets || []).filter(match);
  if (pkgs.length){
    box.appendChild(sectionHead('行业技能包', '按主题打包的学习路径，一键添加为归档', pkgs.length));
    const grid = document.createElement('div');
    grid.className = 'pkg-grid';
    pkgs.forEach(p => grid.appendChild(pkgCard(p)));
    box.appendChild(grid);
  }
  if (dss.length){
    box.appendChild(sectionHead('学习数据集', '精选资料与题库', dss.length));
    const grid = document.createElement('div');
    grid.className = 'dataset-grid';
    dss.forEach(d => grid.appendChild(datasetCard(d)));
    box.appendChild(grid);
  }
  if (!pkgs.length && !dss.length){
    const empty = document.createElement('div');
    empty.className = 'file-empty';
    empty.textContent = '🔍 没有匹配的技能包，换个关键词试试';
    box.appendChild(empty);
  }
}

function pkgCard(p){
  const card = document.createElement('div');
  card.className = 'pkg-card';
  const tags = (p.tags || []).map(t => '<span class="pkg-tag">' + t + '</span>').join('');
  const skills = p.skills || [];
  const visible = skills.slice(0, 3).map(s => '<span class="skill-item">' + escapeHtml(s) + '</span>').join('');
  const hidden = skills.slice(3).map(s => '<span class="skill-item">' + escapeHtml(s) + '</span>').join('');
  card.innerHTML =
    '<div class="pkg-top">' +
      '<span class="pkg-icon">' + p.icon + '</span>' +
      '<div class="pkg-info">' +
        '<div class="pkg-title">' + escapeHtml(p.title) + '</div>' +
        '<div class="pkg-desc">' + escapeHtml(p.desc || '') + '</div>' +
        '<div class="pkg-tags">' + tags + '</div>' +
      '</div>' +
      '<button class="add-btn' + (p.added ? ' added' : '') + '" data-act="add">' + (p.added ? '✅ 去使用' : '➕ 添加') + '</button>' +
    '</div>' +
    '<div class="skills-box">' +
      '<div class="skills-list">' + visible + (hidden ? '<span class="skills-more" data-act="more">展开全部 ' + skills.length + ' 项 ›</span>' : '') + '</div>' +
      '<div class="skills-list hidden" data-role="extra">' + hidden + '</div>' +
    '</div>';

  addBtn.addEventListener('click', () => {

  if (more){
    more.addEventListener('click', () => {
      card.querySelector('[data-role="extra"]').classList.remove('hidden');
      more.classList.add('hidden');

  }
  return card;

function detectLang(text){
  if (/[äöüßÄÖÜ]/.test(text)) return 'de-DE';
  if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
  if (/[àâçéèêëîïôûùüÿœæ]/.test(text)) return 'fr-FR';
  return 'en-US';
}

function speakText(text){
  const t = (text || '').trim();
  if (!t){ addMsg('❌ 请先输入要朗读的单词或句子', 'bot'); return; }
  if (!('speechSynthesis' in window)){
    addMsg('❌ 当前设备不支持语音朗读（建议用 Chrome/Edge，或手机系统开启 TTS）', 'bot');
    return;
  }
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = detectLang(t);
  u.rate = 0.85;
  const voices = synth.getVoices();
  if (voices.length){
    const langPrefix = u.lang.toLowerCase().split('-')[0];
    const v = voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(langPrefix))
           || voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('zh'));
    if (v) u.voice = v;
  }
  synth.speak(u);
}

if ('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragDepth++;
  $('#dropOverlay').classList.remove('hidden');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0){
    dragDepth = 0;
    $('#dropOverlay').classList.add('hidden');
  }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  $('#dropOverlay').classList.add('hidden');
  const dt = e.dataTransfer;
  if (!dt) return;
  // 收集文件（兼容 files 与 items 两种来源）
  const files = [];
  Array.from(dt.files || []).forEach(f => files.push(f));
  if (dt.items){
    Array.from(dt.items).forEach(item => {
      if (item.kind === 'file' && !files.some(f => f.name === (item.getAsFile() || {}).name)){
        const f = item.getAsFile();
        if (f) files.push(f);
      }
    });
  }
  if (files.length){
    addMsg('📥 拖入 ' + files.length + ' 个文件，开始上传', 'user');
    files.slice(0, 10).forEach(uploadFile);
    return;
  }
  let text = (dt.getData('text/plain') || '').trim();
  if (!text){
    try { text = (window.getSelection() ? window.getSelection().toString() : '').trim(); } catch(e){}
  }
  if (text){
    importTexts([text]);
    return;
  }
  addMsg('❌ 未检测到可导入的文件或文本', 'bot');
});

function loadSavedLogin(){
  try {
    const u = localStorage.getItem('study_username') || '';
    if (u){ $('#username').value = u; $('#rememberUser').checked = true; }
    const p = localStorage.getItem('study_password') || '';
    if (p){ $('#password').value = decodeURIComponent(escape(atob(p))); $('#rememberPwd').checked = true; }
    $('#rememberAuto').checked = localStorage.getItem('study_auto_login') === '1';
  } catch(e){}
}

function saveSavedLogin(username, password){
  try {
    localStorage.setItem('study_username', username);
    if ($('#rememberPwd').checked){
      localStorage.setItem('study_password', btoa(unescape(encodeURIComponent(password))));
    } else {
      localStorage.removeItem('study_password');
    }
    if (!$('#rememberUser').checked) localStorage.removeItem('study_username');
    localStorage.setItem('study_auto_login', $('#rememberAuto').checked ? '1' : '0');
  } catch(e){}
}

async function tryAutoLogin(){
  if (localStorage.getItem('study_auto_login') !== '1') return false;
  const username = $('#username').value.trim();
  const password = $('#password').value;
  if (!username || !password) return false;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username, password: password})
    });
    const d = await safeJson(r);
    if (r.ok && d && d.ok){
      currentUser = {username: d.username, role: d.role, is_admin: d.is_admin};
      showApp();
      loadFiles();
      loadStats();
      loadConversations();
      renderSubNav();
      return true;
    }
  } catch(e){}
  try { localStorage.setItem('study_auto_login', '0'); $('#rememberAuto').checked = false; } catch(e){}
  return false;
}

    showFieldError('#userError', '用户名至少3个字符');
    $('#username').focus();
    return;
  }
  if (!password){
    showFieldError('#pwdError', '请输入密码');
    $('#password').focus();
    return;
  }
  if (loginMode === 'register' && password.length < 6){
    showFieldError('#pwdError', '密码至少6位');
    $('#password').focus();
    return;
  }
  setLoginLoading(true);
  try {
    if (loginMode === 'register'){
      const rr = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: username, password: password})
      });
      const rd = await safeJson(rr);
      if (!rd || !rd.ok){ showFieldError('#userError', rd && rd.error ? rd.error : '注册失败'); return; }
      loginMode = 'login';
      $('#loginBtn').textContent = '登 录';
      $('#loginToggle').innerHTML = '没有账号？<span>注册一个</span>';
      $('#loginHint').textContent = '输入账号密码开始使用';
    }
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username, password: password})
    });
    const d = await safeJson(r);
    if (r.ok && d && d.ok){
      currentUser = {username: d.username, role: d.role, is_admin: d.is_admin};

      showApp();
      loadFiles();

      loadConversations();
      renderSubNav();
    } else {

  }

$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#speakBtn').addEventListener('click', () => {
  const text = $('#input').value.trim();
  if (!text){ addMsg('❌ 请先在输入框输入要朗读的内容', 'bot'); return; }
  speakText(text);
});
$('#messages').addEventListener('dblclick', () => {
  try {
    const sel = (window.getSelection() ? window.getSelection().toString() : '').trim();
    if (sel) speakText(sel);
  } catch(e){}
});
$('#themeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleThemePanel();
});
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('#installBtn').classList.remove('hidden');
});
$('#installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('#installBtn').classList.add('hidden');
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  $('#installBtn').classList.add('hidden');
});
$('#tabChat').addEventListener('click', () => switchTab('chat'));
$('#tabFiles').addEventListener('click', () => switchTab('files'));
$('#tabMarket').addEventListener('click', () => switchTab('market'));
$('#backBtn').addEventListener('click', () => switchTab('chat'));
document.querySelectorAll('.side-main').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.view)));
$('#newChatBtn').addEventListener('click', () => newConversation());
$('#drawerBtn').addEventListener('click', () => openDrawer());
$('#drawerClose').addEventListener('click', () => closeDrawer());
$('#drawerMask').addEventListener('click', () => closeDrawer());
$('#drawerNewChat').addEventListener('click', () => { closeDrawer(); newConversation(); });
$('#textBatchOk').addEventListener('click', submitTextBatch);
$('#textBatchCancel').addEventListener('click', closeTextModal);
$('#fileSearch').addEventListener('input', (e) => {
  fileSearchKw = e.target.value.trim().toLowerCase();
  if (!$('#fileView').classList.contains('hidden')) loadFiles();
});
$('#marketSearch').addEventListener('input', (e) => {
  marketKw = e.target.value.trim().toLowerCase();
  if (marketData) renderMarket();
});
$('#marketGenBtn').addEventListener('click', () => { switchTab('chat'); runChat('/market'); });
$('#messages').addEventListener('scroll', () => {
  const m = $('#messages');
  const dist = m.scrollHeight - m.scrollTop - m.clientHeight;
  if (dist > 80){
    autoScroll = false;
    $('#scrollDown').classList.remove('hidden');
  } else {
    autoScroll = true;
    $('#scrollDown').classList.add('hidden');
  }
});
$('#scrollDown').addEventListener('click', () => forceScrollToBottom());
document.addEventListener('click', (e) => {
  if (!e.target.closest('#themePanel') && !e.target.closest('#themeBtn')) $('#themePanel').classList.add('hidden');
});
$('#attach').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', upload);
const MENU = {

    {label: '📌 今日任务', cmd: '/today'},
    {label: '🚀 额外任务', cmd: '/extra'},
    {label: '📇 背诵卡片', next: 'cards'},
    {label: '📝 自测题', next: 'test'},
    {label: '📅 学习计划', next: 'plan'},
    {label: '📆 每日任务', next: 'daily'},
    {label: '📊 学习进度', next: 'progress'},
    {label: '✅ 打卡', next: 'done'},
    {label: '🎯 长期目标', cmd: '/goals'},
    {label: '📊 学情报告', cmd: '/report'},
    {label: '📕 错题本', cmd: '/wrong'}
  ],

  ],

};

function runMenuAction(item){
  if (item.action === 'upload'){ $('#fileInput').click(); return; }
  if (item.action === 'textbatch'){ openTextModal(); return; }
  if (item.next){ startOptions(item.next); return; }
  runChat(item.cmd);
}

function renderSubNav(){
  const nav = $('#subnav');
  if (!nav) return;
  nav.innerHTML = '';
  const groupNames = {study: '学习', materials: '资料', more: '更多'};
  Object.keys(MENU).forEach(group => {
    const g = document.createElement('div');
    g.className = 'subnav-group';
    const label = document.createElement('span');
    label.className = 'subnav-label';
    label.textContent = groupNames[group] || group;
    g.appendChild(label);
    MENU[group].forEach(item => {
      if (item.admin && currentUser && !currentUser.is_admin) return;
      const b = document.createElement('button');
      b.textContent = item.label;
      b.addEventListener('click', () => {
        switchTab('chat');
        runMenuAction(item);
      });
      g.appendChild(b);
    });
    nav.appendChild(g);
  });
}
renderSubNav();

let activeGroup = null;

function hideSubmenu(){
  activeGroup = null;
  $('#submenu').classList.add('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.remove('active'));
}

function showSubmenu(group){
  activeGroup = group;
  const box = $('#submenu');
  box.innerHTML = '';
  MENU[group].forEach(item => {
    const b = document.createElement('button');
    b.textContent = item.label;
    b.addEventListener('click', () => {
      hideSubmenu();
      runMenuAction(item);
    });
    box.appendChild(b);
  });
  box.classList.remove('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.toggle('active', w.dataset.group === group));
}

function renderMoreMenu(){
  const box = $('#submenu');
  box.innerHTML = '';
  const groupNames = {study: '学习', materials: '资料', more: '更多'};
  Object.keys(MENU).forEach(group => {
    const label = document.createElement('div');
    label.className = 'sidebar-group';
    label.textContent = groupNames[group] || group;
    box.appendChild(label);
    MENU[group].forEach(item => {
      if (item.admin && currentUser && !currentUser.is_admin) return;
      const b = document.createElement('button');
      b.textContent = item.label;
      b.addEventListener('click', () => {
        hideSubmenu();
        switchTab('chat');
        runMenuAction(item);
      });
      box.appendChild(b);
    });
  });
}

function toggleMoreMenu(){
  const box = $('#submenu');
  if (!box.classList.contains('hidden')){
    hideSubmenu();
    return;
  }
  renderMoreMenu();
  box.classList.remove('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.toggle('active', w.id === 'moreBtn'));
}

function renderDrawerGroups(){
  const box = $('#drawerGroups');
  if (!box) return;
  box.innerHTML = '';
  const groupNames = {study: '学习', materials: '资料', more: '更多'};
  Object.keys(MENU).forEach(group => {
    const label = document.createElement('div');
    label.className = 'sidebar-group';
    label.textContent = groupNames[group] || group;
    box.appendChild(label);
    MENU[group].forEach(item => {
      if (item.admin && currentUser && !currentUser.is_admin) return;
      const b = document.createElement('button');
      b.className = 'sidebar-item';
      b.textContent = item.label;
      b.addEventListener('click', () => {
        closeDrawer();
        switchTab('chat');
        runMenuAction(item);
      });
      box.appendChild(b);
    });
  });
}

function openDrawer(){
  renderConvList(convsCache);
  renderDrawerGroups();
  $('#drawer').classList.remove('hidden');
  $('#drawerMask').classList.remove('hidden');
}

function closeDrawer(){
  $('#drawer').classList.add('hidden');
  $('#drawerMask').classList.add('hidden');
}

document.querySelectorAll('.wbar .wbtn').forEach(w => w.addEventListener('click', (e) => {
  e.stopPropagation();
  if (w.dataset.view){
    hideSubmenu();
    switchTab(w.dataset.view);
    return;
  }
  toggleMoreMenu();
}));
document.addEventListener('click', (e) => {
  if (!e.target.closest('#submenu') && !e.target.closest('.wbar')) hideSubmenu();
});

init();
