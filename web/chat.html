<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4a7dff">
<link rel="manifest" href="/manifest.json">
<title>学习助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; height: 100vh; display: flex; flex-direction: column; }
  header { background: #4a7dff; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 15px; }
  .msg.user .bubble { background: #4a7dff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #222; border: 1px solid #e5e9f2; border-bottom-left-radius: 4px; }
  .msg.bot .bubble h1 { font-size: 17px; margin: 8px 0 4px; }
  .msg.bot .bubble h2 { font-size: 16px; margin: 8px 0 4px; color: #4a7dff; }
  .msg.bot .bubble h3 { font-size: 15px; margin: 8px 0 4px; }
  .msg.bot .bubble h4 { font-size: 14px; margin: 6px 0 3px; }
  .msg.bot .bubble p { margin: 4px 0; }
  .msg.bot .bubble ul, .msg.bot .bubble ol { margin: 4px 0 4px 18px; padding: 0; }
  .msg.bot .bubble li { margin: 2px 0; }
  .msg.bot .bubble pre { background: #f4f6fb; border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
  .msg.bot .bubble code { background: #eef1f7; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg.bot .bubble pre code { background: none; padding: 0; }
  .msg.bot .bubble table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 13px; }
  .msg.bot .bubble th, .msg.bot .bubble td { border: 1px solid #dde3ee; padding: 4px 8px; text-align: left; }
  .msg.bot .bubble th { background: #eef3ff; }
  .msg.bot .bubble hr { border: none; border-top: 1px dashed #dde3ee; margin: 8px 0; }
  .bubble.typing { color: #999; }
  .wbar { display: flex; background: #fff; border-top: 1px solid #eef1f7; }
  .wbtn { flex: 1; padding: 11px 0; border: none; background: #fff; color: #333; font-size: 14px; cursor: pointer; border-right: 1px solid #f0f2f7; }
  .wbtn:last-child { border-right: none; }
  .wbtn.active { color: #4a7dff; font-weight: 600; }
  .submenu { background: #fff; border-top: 1px solid #eef1f7; box-shadow: 0 -2px 8px rgba(0,0,0,.05); max-height: 240px; overflow-y: auto; }
  .submenu button { display: block; width: 100%; text-align: left; padding: 11px 16px; border: none; background: #fff; font-size: 14px; border-bottom: 1px solid #f4f6fb; cursor: pointer; }
  .submenu button:active { background: #f0f4ff; }
  .option-box { display: flex; flex-wrap: wrap; gap: 8px; background: #fff; border: 1px solid #e5e9f2; border-radius: 16px; padding: 10px; max-width: 82%; }
  .opt-btn { padding: 8px 14px; border-radius: 16px; background: #eef3ff; color: #4a7dff; font-size: 14px; border: none; cursor: pointer; }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #eef1f7; }
  #input { flex: 1; border: 1px solid #dfe4ef; border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none; }
  #send { background: #4a7dff; color: #fff; border: none; border-radius: 20px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  #attach { background: #eef3ff; color: #4a7dff; border: none; border-radius: 20px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  .login { position: fixed; inset: 0; background: #4a7dff; display: flex; align-items: center; justify-content: center; }
  .login-card { background: #fff; border-radius: 16px; padding: 28px 24px; width: 82%; max-width: 340px; text-align: center; }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: #888; font-size: 13px; margin-bottom: 18px; }
  .login-card input { width: 100%; border: 1px solid #dfe4ef; border-radius: 10px; padding: 11px; font-size: 15px; margin-bottom: 12px; outline: none; }
  .login-card button { width: 100%; background: #4a7dff; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 15px; cursor: pointer; }
  .hidden { display: none !important; }
  #logout { margin-left: auto; background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 12px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <h1>📚 学习助手</h1>
    <p>输入访问密码开始使用</p>
    <input id="password" type="password" placeholder="访问密码" autocomplete="current-password">
    <button id="loginBtn">进入</button>
  </div>
</div>
<div id="app" class="hidden">
  <header>📚 学习助手 <button id="logout">退出</button></header>
  <main id="messages"></main>
  <div id="submenu" class="submenu hidden"></div>
  <div class="wbar">
    <button class="wbtn" data-group="study">📚 学习</button>
    <button class="wbtn" data-group="materials">📁 资料</button>
    <button class="wbtn" data-group="more">⋯ 更多</button>
  </div>
  <footer>
    <button id="attach" title="上传文件（PDF/DOC/DOCX/PPTX）">📎</button>
    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.pptx,.jpg,.jpeg,.png,.bmp,.webp" hidden>
    <input id="input" placeholder="输入问题或指令…">
    <button id="send">发送</button>
  </footer>
</div>
<script>
const $ = s => document.querySelector(s);

function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#input').focus(); }

function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineFormat(s){
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
}

function renderMarkdown(text){
  const lines = escapeHtml(text).split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (/^```/.test(line.trim())){
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + code.join('\n') + '</code></pre>');
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h){
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inlineFormat(h[2]) + '</h' + lv + '>');
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i].trim()); i++; }
      const parseRow = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inlineFormat(c.trim()));
      const header = parseRow(rows[0]);
      let t = '<table><thead><tr>' + header.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
      for (let r = 2; r < rows.length; r++){
        t += '<tr>' + parseRow(rows[r]).map(x => '<td>' + x + '</td>').join('') + '</tr>';
      }
      out.push(t + '</tbody></table>');
      continue;
    }
    if (/^\s*[-•]\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^[-•]\s+/.test(t)){
          items.push('<li>' + inlineFormat(t.replace(/^[-•]\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^\d+\.\s+/.test(t)){
          const num = parseInt(t, 10);
          items.push('<li value="' + num + '">' + inlineFormat(t.replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ol>' + items.join('') + '</ol>');
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() !== '' && !/^```/.test(lines[i].trim()) && !/^#{1,4}\s/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*[-•]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      para.push(inlineFormat(lines[i].trim()));
      i++;
    }
    if (para.length){ out.push('<p>' + para.join('<br>') + '</p>'); }
    else { i++; }
  }
  return out.join('');
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (who === 'bot'){ b.innerHTML = renderMarkdown(text); }
  else { b.textContent = text; }
  div.appendChild(b);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg bot';
  const b = document.createElement('div');
  b.className = 'bubble typing';
  b.textContent = '正在思考…';
  div.appendChild(b);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
  return div;
}

async function safeJson(r){
  try { return await r.json(); } catch (e) { return null; }
}

async function pollTask(taskId){
  const typing = addTyping();
  let tries = 0;
  try {
    while (tries < 600) {
      tries += 1;
      const r = await fetch('/api/task?task_id=' + encodeURIComponent(taskId));
      const d = await safeJson(r);
      if (r.status === 401) { typing.remove(); showLogin(); return null; }
      if (d && d.status === 'done') { typing.remove(); return d; }
      if (d && !d.ok) { typing.remove(); addMsg('❌ ' + (d.error || '任务失败'), 'bot'); return null; }
      await new Promise(res => setTimeout(res, 1500));
    }
    typing.remove();
    addMsg('❌ 任务处理超时（超过15分钟），请重试', 'bot');
    return null;
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
    return null;
  }
}

async function runChat(text){
  addMsg(text, 'user');
  const typing = addTyping();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const d = await safeJson(r);
    typing.remove();
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok || !d.task_id) { addMsg('❌ ' + (d.error || '发送失败'), 'bot'); return; }
    const result = await pollTask(d.task_id);
    if (!result) return;
    addMsg(result.reply, 'bot');
    if (result.options) renderOptions(result.options);
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function send(){
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  runChat(text);
}

async function fetchOptions(body){
  const typing = addTyping();
  try {
    const r = await fetch('/api/options', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await safeJson(r);
    typing.remove();
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok) { addMsg('❌ ' + (d.error || '出错了'), 'bot'); return; }
    if (d.prompt) addMsg(d.prompt, 'bot');
    renderOptions(d.options);
    if (d.run) runChat(d.run);
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function renderOptions(options){
  if (!options || !options.length) return;
  const div = document.createElement('div');
  div.className = 'msg bot';
  const box = document.createElement('div');
  box.className = 'option-box';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o.label;
    b.addEventListener('click', () => {
      if (o.payload && o.payload.step === 'run') {
        runChat(o.payload.cmd);
      } else {
        fetchOptions(o.payload);
      }
    });
    box.appendChild(b);
  });
  div.appendChild(box);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

function startOptions(next){
  fetchOptions({next: next});
}

async function upload(){
  const input = $('#fileInput');
  const file = input.files[0];
  if (!file) return;
  addMsg('📎 ' + file.name, 'user');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/upload', {method: 'POST', body: fd});
    const d = await safeJson(r);
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok || !d.task_id) { addMsg('❌ ' + (d.error || '上传失败'), 'bot'); return; }
    const result = await pollTask(d.task_id);
    if (result) addMsg(result.reply, 'bot');
  } catch (e) {
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
  input.value = '';
}

async function init(){
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.need_login && !s.authed) showLogin(); else showApp();
  } catch (e) { showLogin(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
}

$('#loginBtn').addEventListener('click', async () => {
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: $('#password').value})
  });
  if (r.ok) showApp(); else alert('密码错误');
});
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#send').addEventListener('click', send);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#attach').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', upload);
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', {method: 'POST'}); showLogin(); });
const MENU = {
  study: [
    {label: '📌 今日任务', cmd: '/today'},
    {label: '🚀 额外任务', cmd: '/extra'},
    {label: '📇 背诵卡片', next: 'cards'},
    {label: '📝 自测题', next: 'test'},
    {label: '📅 学习计划', next: 'plan'},
    {label: '📆 每日任务', next: 'daily'},
    {label: '📊 学习进度', next: 'progress'},
    {label: '✅ 打卡', next: 'done'}
  ],
  materials: [
    {label: '🗂 归档清单', cmd: '/list'},
    {label: '🗂 合并归档', next: 'merge'},
    {label: '📄 合并来源', next: 'mergeinfo'},
    {label: '🗑 删除文档', next: 'delete'},
    {label: '📎 上传文件', action: 'upload'}
  ],
  more: [
    {label: '📋 指令清单', cmd: '/help'},
    {label: '✍️ 文本润色', next: 'polish'},
    {label: '🔄 重建知识库', cmd: '/rebuild'}
  ]
};

let activeGroup = null;

function hideSubmenu(){
  activeGroup = null;
  $('#submenu').classList.add('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.remove('active'));
}

function showSubmenu(group){
  activeGroup = group;
  const box = $('#submenu');
  box.innerHTML = '';
  MENU[group].forEach(item => {
    const b = document.createElement('button');
    b.textContent = item.label;
    b.addEventListener('click', () => {
      hideSubmenu();
      if (item.action === 'upload'){ $('#fileInput').click(); return; }
      if (item.next){ startOptions(item.next); return; }
      runChat(item.cmd);
    });
    box.appendChild(b);
  });
  box.classList.remove('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.toggle('active', w.dataset.group === group));
}

document.querySelectorAll('.wbtn').forEach(w => w.addEventListener('click', (e) => {
  e.stopPropagation();
  const g = w.dataset.group;
  if (activeGroup === g){ hideSubmenu(); } else { showSubmenu(g); }
}));
document.addEventListener('click', (e) => {
  if (!e.target.closest('#submenu') && !e.target.closest('.wbar')) hideSubmenu();
});

init();
</script>
</body>
</html>
