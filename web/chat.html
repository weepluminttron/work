<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4a7dff">
<link rel="manifest" href="/manifest.json">
<title>学习助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #4a7dff;
    --primary-2: #6a9bff;
    --primary-soft: #eef3ff;
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #222222;
    --text-2: #666666;
    --text-3: #999999;
    --border: #e5e9f2;
    --border-2: #dfe4ef;
    --code-bg: #f4f6fb;
    --input-bg: #ffffff;
    --shadow: 0 4px 14px rgba(30, 60, 140, .08);
    --radius: 16px;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  body.theme-green  { --primary: #2e9e6b; --primary-2: #58c08c; --primary-soft: #e6f6ee; --bg: #f2f9f5; --shadow: 0 4px 14px rgba(30, 110, 80, .10); }
  body.theme-dark   { --primary: #7aa2ff; --primary-2: #9dbdff; --primary-soft: #1d2a44; --bg: #12151c; --card: #1c212c; --text: #e6e9f0; --text-2: #a0a8b8; --text-3: #7c8494; --border: #2a3140; --border-2: #333b4c; --code-bg: #262d3b; --input-bg: #1c212c; --shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  body.theme-pink   { --primary: #ff6b9d; --primary-2: #ff8fb5; --primary-soft: #ffe9f1; --bg: #fff5f8; --shadow: 0 4px 14px rgba(255, 100, 150, .12); }
  body.theme-warm   { --primary: #e8a33d; --primary-2: #f7c948; --primary-soft: #fdf1dd; --bg: #fffaf0; --shadow: 0 4px 14px rgba(200, 140, 30, .12); }
  body.theme-minimal{ --primary: #333333; --primary-2: #555555; --primary-soft: #f2f2f2; --bg: #ffffff; --border: #eeeeee; --border-2: #e5e5e5; --code-bg: #f7f7f7; --shadow: 0 2px 10px rgba(0, 0, 0, .05); }

  header { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(0, 0, 0, .08); position: relative; z-index: 20; }
  main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  main::-webkit-scrollbar, .submenu::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb, .submenu::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 15px; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .msg.bot .bubble h1 { font-size: 17px; margin: 8px 0 4px; }
  .msg.bot .bubble h2 { font-size: 16px; margin: 8px 0 4px; color: var(--primary); }
  .msg.bot .bubble h3 { font-size: 15px; margin: 8px 0 4px; }
  .msg.bot .bubble h4 { font-size: 14px; margin: 6px 0 3px; }
  .msg.bot .bubble p { margin: 4px 0; }
  .msg.bot .bubble ul, .msg.bot .bubble ol { margin: 4px 0 4px 18px; padding: 0; }
  .msg.bot .bubble li { margin: 2px 0; }
  .msg.bot .bubble pre { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
  .msg.bot .bubble code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg.bot .bubble pre code { background: none; padding: 0; }
  .msg.bot .bubble table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 13px; }
  .msg.bot .bubble th, .msg.bot .bubble td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg.bot .bubble th { background: var(--primary-soft); }
  .msg.bot .bubble hr { border: none; border-top: 1px dashed var(--border); margin: 8px 0; }
  .bubble.typing { color: var(--text-3); }
  .wbar { display: flex; background: var(--card); border-top: 1px solid var(--border); }
  .wbtn { flex: 1; padding: 11px 0; border: none; background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; border-right: 1px solid var(--border); transition: color .15s; }
  .wbtn:last-child { border-right: none; }
  .wbtn.active { color: var(--primary); font-weight: 600; }
  .submenu { background: var(--card); border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0, 0, 0, .05); max-height: 240px; overflow-y: auto; }
  .submenu button { display: block; width: 100%; text-align: left; padding: 11px 16px; border: none; background: var(--card); color: var(--text); font-size: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .submenu button:active { background: var(--primary-soft); }
  .option-box { display: flex; flex-wrap: wrap; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; max-width: 82%; box-shadow: var(--shadow); }
  .opt-btn { padding: 8px 14px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); font-size: 14px; border: none; cursor: pointer; transition: transform .12s, filter .12s; }
  .opt-btn:active { transform: scale(.96); filter: brightness(.95); }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: var(--card); border-top: 1px solid var(--border); }
  #input { flex: 1; border: 1px solid var(--border-2); border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none; background: var(--input-bg); color: var(--text); }
  #input:focus { border-color: var(--primary); }
  #send { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; border-radius: 20px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  #attach { background: var(--primary-soft); color: var(--primary); border: none; border-radius: 20px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  .login { position: fixed; inset: 0; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--card); color: var(--text); border-radius: var(--radius); padding: 28px 24px; width: 82%; max-width: 340px; text-align: center; box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
  .login-card input { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 11px; font-size: 15px; margin-bottom: 12px; outline: none; background: var(--input-bg); color: var(--text); }
  .login-card button { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 15px; cursor: pointer; }
  .hidden { display: none !important; }
  #logout, #themeBtn { margin-left: auto; background: rgba(255, 255, 255, .2); border: none; color: #fff; border-radius: 12px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #themeBtn { margin-left: 0; font-size: 15px; }

  .quiz-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; max-width: 94%; width: 94%; box-shadow: var(--shadow); }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }
  .quiz-progress { font-weight: 600; color: var(--primary); }
  .quiz-q { background: var(--primary-soft); border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .quiz-opt { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .quiz-opt button { text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--input-bg); color: var(--text); font-size: 14px; cursor: pointer; transition: transform .12s; }
  .quiz-opt button:active { transform: scale(.98); }
  .quiz-opt button.sel { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: var(--primary); }
  .quiz-q-input { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 12px; font-size: 14px; outline: none; background: var(--input-bg); color: var(--text); }
  .quiz-sheet { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 10px 0; }
  .quiz-sheet button { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border-2); background: var(--input-bg); color: var(--text); font-size: 12px; cursor: pointer; position: relative; transition: transform .1s; }
  .quiz-sheet button:active { transform: scale(.92); }
  .quiz-sheet button.answered { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: var(--primary); }
  .quiz-sheet button.marked { background: #ffd54a; color: #222; border-color: #f0b400; }
  .quiz-sheet button.current { outline: 2px solid #ff6b6b; }
  .quiz-sheet button.marked::after { content: '?'; position: absolute; top: -5px; right: -2px; font-size: 10px; }
  .quiz-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-ctrl button { flex: 1; min-width: 78px; padding: 8px 6px; border-radius: 10px; border: none; background: var(--primary-soft); color: var(--primary); font-size: 13px; cursor: pointer; }
  .quiz-ctrl button.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
  .quiz-ctrl button:disabled { opacity: .4; cursor: default; }

  .theme-panel { position: fixed; right: 12px; top: 54px; z-index: 50; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }
  .theme-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 12px; cursor: pointer; }
  .theme-item.active { outline: 2px solid var(--primary); }
  .theme-swatch { display: flex; gap: 3px; }
  .theme-swatch i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }

  /* ===== Coze 风格布局 ===== */
  .layout { display: flex; height: 100vh; min-height: 0; }
  .sidebar { display: none; width: 220px; background: var(--card); border-right: 1px solid var(--border); flex-direction: column; }
  .sidebar-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; font-size: 16px; font-weight: 700; color: var(--text); }
  .sidebar-head .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .sidebar-nav { flex: 1; padding: 2px 10px 10px; overflow-y: auto; }
  .sidebar-group { padding: 14px 12px 6px; font-size: 12px; color: var(--text-3); }
  .sidebar-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent; color: var(--text); font-size: 13.5px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
  .sidebar-item:hover { background: var(--primary-soft); color: var(--primary); }
  .sidebar-item:active { background: var(--primary-soft); }
  .sidebar-foot { padding: 14px 16px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border); }
  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: var(--card); color: var(--text); border-bottom: 1px solid var(--border); box-shadow: none; padding: 12px 18px; }
  #logout, #themeBtn { background: var(--primary-soft); color: var(--primary); }
  main { max-width: 860px; width: 100%; margin: 0 auto; padding: 18px 16px; }
  .msg.bot { align-items: flex-start; gap: 8px; }
  .msg.bot::before { content: '📚'; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; margin-top: 2px; }
  .msg.bot .bubble { max-width: calc(82% - 38px); border-radius: 16px 16px 16px 4px; }
  .msg.user .bubble { border-radius: 16px 16px 4px 16px; }
  .option-box { max-width: calc(82% - 38px); }
  .quiz-box { max-width: calc(94% - 38px); width: calc(94% - 38px); }
  footer { max-width: 860px; width: 100%; margin: 0 auto; background: transparent; border-top: none; padding: 10px 16px 14px; gap: 8px; }
  #input { border-radius: 22px; padding: 11px 16px; box-shadow: var(--shadow); }
  #attach { border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; padding: 0; font-size: 17px; }
  #send { border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; padding: 0; font-size: 16px; }
  @media (min-width: 900px) {
    .sidebar { display: flex; }
    .wbar { display: none; }
  }
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <h1>📚 学习助手</h1>
    <p>输入访问密码开始使用</p>
    <input id="password" type="password" placeholder="访问密码" autocomplete="current-password">
    <button id="loginBtn">进入</button>
  </div>
</div>
<div id="app" class="hidden">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head"><span class="logo">📚</span><span>学习助手</span></div>
      <div class="sidebar-nav" id="sidebarNav"></div>
      <div class="sidebar-foot">AI 智能学伴</div>
    </aside>
    <div class="main-col">
      <header>📚 学习助手 <button id="themeBtn" title="切换界面风格">🎨</button><button id="logout">退出</button></header>
      <div id="themePanel" class="theme-panel hidden"></div>
      <main id="messages"></main>
      <div id="submenu" class="submenu hidden"></div>
      <div class="wbar">
        <button class="wbtn" data-group="study">📚 学习</button>
        <button class="wbtn" data-group="materials">📁 资料</button>
        <button class="wbtn" data-group="more">⋯ 更多</button>
      </div>
      <footer>
        <button id="attach" title="上传文件（PDF/DOC/DOCX/PPTX/图片）">📎</button>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.pptx,.jpg,.jpeg,.png,.bmp,.webp" hidden>
        <input id="input" placeholder="输入问题或指令…">
        <button id="send">➤</button>
      </footer>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);

function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
function showApp(){ $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#input').focus(); }

function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineFormat(s){
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
}

function renderMarkdown(text){
  const lines = escapeHtml(text).split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length){
    const line = lines[i];
    if (/^```/.test(line.trim())){
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + code.join('\n') + '</code></pre>');
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h){
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inlineFormat(h[2]) + '</h' + lv + '>');
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])){
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i].trim()); i++; }
      const parseRow = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inlineFormat(c.trim()));
      const header = parseRow(rows[0]);
      let t = '<table><thead><tr>' + header.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
      for (let r = 2; r < rows.length; r++){
        t += '<tr>' + parseRow(rows[r]).map(x => '<td>' + x + '</td>').join('') + '</tr>';
      }
      out.push(t + '</tbody></table>');
      continue;
    }
    if (/^\s*[-•]\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^[-•]\s+/.test(t)){
          items.push('<li>' + inlineFormat(t.replace(/^[-•]\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)){
      const items = [];
      while (i < lines.length){
        const t = lines[i].trim();
        if (/^\d+\.\s+/.test(t)){
          const num = parseInt(t, 10);
          items.push('<li value="' + num + '">' + inlineFormat(t.replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        } else if (t === ''){
          i++;
        } else {
          break;
        }
      }
      out.push('<ol>' + items.join('') + '</ol>');
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() !== '' && !/^```/.test(lines[i].trim()) && !/^#{1,4}\s/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*[-•]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      para.push(inlineFormat(lines[i].trim()));
      i++;
    }
    if (para.length){ out.push('<p>' + para.join('<br>') + '</p>'); }
    else { i++; }
  }
  return out.join('');
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (who === 'bot'){ b.innerHTML = renderMarkdown(text); }
  else { b.textContent = text; }
  div.appendChild(b);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg bot';
  const b = document.createElement('div');
  b.className = 'bubble typing';
  b.textContent = '正在思考…';
  div.appendChild(b);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
  return div;
}

async function safeJson(r){
  try { return await r.json(); } catch (e) { return null; }
}

async function pollTask(taskId){
  const typing = addTyping();
  let tries = 0;
  try {
    while (tries < 600) {
      tries += 1;
      const r = await fetch('/api/task?task_id=' + encodeURIComponent(taskId));
      const d = await safeJson(r);
      if (r.status === 401) { typing.remove(); showLogin(); return null; }
      if (d && d.status === 'done') { typing.remove(); return d; }
      if (d && !d.ok) { typing.remove(); addMsg('❌ ' + (d.error || '任务失败'), 'bot'); return null; }
      await new Promise(res => setTimeout(res, 1500));
    }
    typing.remove();
    addMsg('❌ 任务处理超时（超过15分钟），请重试', 'bot');
    return null;
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
    return null;
  }
}

async function runChat(text){
  addMsg(text, 'user');
  const typing = addTyping();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const d = await safeJson(r);
    typing.remove();
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok || !d.task_id) { addMsg('❌ ' + (d.error || '发送失败'), 'bot'); return; }
    const result = await pollTask(d.task_id);
    if (!result) return;
    addMsg(result.reply, 'bot');
    if (result.options) renderOptions(result.options);
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function send(){
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  runChat(text);
}

async function fetchOptions(body){
  const typing = addTyping();
  try {
    const r = await fetch('/api/options', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await safeJson(r);
    typing.remove();
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok) { addMsg('❌ ' + (d.error || '出错了'), 'bot'); return; }
    if (d.prompt) addMsg(d.prompt, 'bot');
    renderOptions(d.options);
    if (d.run) runChat(d.run);
  } catch (e) {
    typing.remove();
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

function renderOptions(options){
  if (!options || !options.length) return;
  const div = document.createElement('div');
  div.className = 'msg bot';
  const box = document.createElement('div');
  box.className = 'option-box';
  options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o.label;
    b.addEventListener('click', () => {
      if (o.payload && o.payload.step === 'quiz') {
        openQuiz(o.payload.aid);
      } else if (o.payload && o.payload.step === 'run') {
        runChat(o.payload.cmd);
      } else {
        fetchOptions(o.payload);
      }
    });
    box.appendChild(b);
  });
  div.appendChild(box);
  $('#messages').appendChild(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

let quizState = null;

function quizSaveLocal(st){
  try { localStorage.setItem('quiz_' + st.aid, JSON.stringify({answers: st.answers, marked: st.marked})); } catch(e){}
}

function quizSaveServer(st){
  fetch('/api/quiz_save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({aid: st.aid, answers: st.answers, marked: st.marked})
  }).catch(() => {});
}

function quizSave(st){
  quizSaveLocal(st);
  quizSaveServer(st);
}

function renderQuiz(st){
  quizState = st;
  let wrap = st.wrap;
  if (!wrap){
    wrap = document.createElement('div');
    wrap.className = 'msg bot';
    st.wrap = wrap;
    $('#messages').appendChild(wrap);
  } else {
    wrap.innerHTML = '';
  }
  const box = document.createElement('div');
  box.className = 'quiz-box';

  const total = st.questions.length;
  const answered = st.questions.filter(q => (st.answers[q.no] || '').trim() !== '').length;
  const q = st.questions[st.current];

  const head = document.createElement('div');
  head.className = 'quiz-head';
  head.innerHTML = '<span>📝 答题模式｜归档ID ' + st.aid + '</span><span class="quiz-progress">已答 ' + answered + '/' + total + '</span>';
  box.appendChild(head);

  const qbox = document.createElement('div');
  qbox.className = 'quiz-q';
  qbox.textContent = '第' + q.no + '题：\n' + q.text;
  box.appendChild(qbox);

  const optWrap = document.createElement('div');
  optWrap.className = 'quiz-opt';
  if (q.options && q.options.length){
    q.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.key + '. ' + o.text;
      if ((st.answers[q.no] || '').toUpperCase() === o.key) b.classList.add('sel');
      b.addEventListener('click', () => {
        st.answers[q.no] = o.key;
        quizSave(st);
        renderQuiz(st);
      });
      optWrap.appendChild(b);
    });
  } else {
    const inp = document.createElement('input');
    inp.className = 'quiz-q-input';
    inp.placeholder = '简答题：输入你的回答（不会自动批改）';
    inp.value = st.answers[q.no] || '';
    inp.addEventListener('change', () => {
      st.answers[q.no] = inp.value.trim();
      quizSave(st);
    });
    optWrap.appendChild(inp);
  }
  box.appendChild(optWrap);

  const sheet = document.createElement('div');
  sheet.className = 'quiz-sheet';
  st.questions.forEach((qq, idx) => {
    const b = document.createElement('button');
    b.textContent = qq.no;
    if ((st.answers[qq.no] || '').trim()) b.classList.add('answered');
    if (st.marked.includes(qq.no)) b.classList.add('marked');
    if (idx === st.current) b.classList.add('current');
    b.title = '第' + qq.no + '题';
    b.addEventListener('click', () => { st.current = idx; renderQuiz(st); });
    sheet.appendChild(b);
  });
  box.appendChild(sheet);

  const ctrl = document.createElement('div');
  ctrl.className = 'quiz-ctrl';
  const btnPrev = document.createElement('button');
  btnPrev.textContent = '⬅ 上一题';
  btnPrev.disabled = st.current <= 0;
  btnPrev.addEventListener('click', () => { st.current = Math.max(0, st.current - 1); renderQuiz(st); });
  const btnNext = document.createElement('button');
  btnNext.textContent = '下一题 ➡';
  btnNext.addEventListener('click', () => { st.current = Math.min(total - 1, st.current + 1); renderQuiz(st); });
  const btnMark = document.createElement('button');
  btnMark.textContent = st.marked.includes(q.no) ? '取消标记 ⚑' : '标记本题 ⚑';
  btnMark.addEventListener('click', () => {
    const idx = st.marked.indexOf(q.no);
    if (idx >= 0) st.marked.splice(idx, 1); else st.marked.push(q.no);
    quizSave(st);
    renderQuiz(st);
  });
  const btnSave = document.createElement('button');
  btnSave.textContent = '💾 保存进度';
  btnSave.addEventListener('click', () => {
    quizSave(st);
    addMsg('✅ 答题进度已保存，下次打开可继续', 'bot');
  });
  const btnSubmit = document.createElement('button');
  btnSubmit.className = 'primary';
  btnSubmit.textContent = '✅ 提交批改';
  btnSubmit.addEventListener('click', () => submitQuiz(st, box));
  ctrl.appendChild(btnPrev);
  ctrl.appendChild(btnNext);
  ctrl.appendChild(btnMark);
  ctrl.appendChild(btnSave);
  ctrl.appendChild(btnSubmit);
  box.appendChild(ctrl);

  wrap.appendChild(box);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

async function submitQuiz(st, box){
  const answers = {};
  st.questions.forEach(qq => {
    const v = (st.answers[qq.no] || '').trim();
    if (v) answers[qq.no] = v;
  });
  quizSaveLocal(st);
  try {
    const r = await fetch('/api/quiz_submit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({aid: st.aid, answers: answers})
    });
    let d = null;
    try { d = await r.json(); } catch(e){ d = null; }
    if (!d){ addMsg('❌ 服务器响应异常（可能处理超时），请稍后重试', 'bot'); return; }
    if (!d.ok){ addMsg('❌ ' + (d.error || '提交失败'), 'bot'); return; }
    if (st.wrap) st.wrap.remove();
    addMsg(d.reply, 'bot');
    if (d.options) renderOptions(d.options);
  } catch(e){
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

async function openQuiz(aid){
  try {
    const r = await fetch('/api/quiz?aid=' + encodeURIComponent(aid));
    let d = null;
    try { d = await r.json(); } catch(e){ d = null; }
    if (!d){ addMsg('❌ 服务器响应异常（可能处理超时），请稍后重试', 'bot'); return; }
    if (!d.ok){ addMsg('❌ ' + (d.error || '加载失败'), 'bot'); return; }
    let answers = {};
    let marked = [];
    try {
      const rr = await fetch('/api/quiz_resume?aid=' + encodeURIComponent(aid));
      let rd = null;
      try { rd = await rr.json(); } catch(e){ rd = null; }
      if (rd.ok){ answers = rd.answers || {}; marked = rd.marked || []; }
    } catch(e){}
    try {
      const local = localStorage.getItem('quiz_' + aid);
      if (local){
        const ls = JSON.parse(local);
        answers = ls.answers || answers;
        marked = ls.marked || marked;
      }
    } catch(e){}
    const st = {aid: aid, questions: d.questions, answers: answers, marked: marked, current: 0};
    renderQuiz(st);
    addMsg('🖊 答题卡已打开：点选项作答会变蓝，标记会变黄，切换/保存进度都不会丢失', 'bot');
  } catch(e){
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
}

const THEMES = [
  {id: 'default', name: '默认蓝', colors: ['#4a7dff', '#6a9bff']},
  {id: 'green', name: '清新绿', colors: ['#2e9e6b', '#58c08c']},
  {id: 'dark', name: '暗夜黑', colors: ['#7aa2ff', '#12151c']},
  {id: 'pink', name: '少女粉', colors: ['#ff6b9d', '#ff8fb5']},
  {id: 'warm', name: '暖阳黄', colors: ['#e8a33d', '#f7c948']},
  {id: 'minimal', name: '极简白', colors: ['#333333', '#eeeeee']}
];

function applyTheme(id){
  document.body.classList.remove('theme-default', 'theme-green', 'theme-dark', 'theme-pink', 'theme-warm', 'theme-minimal');
  document.body.classList.add('theme-' + id);
  try { localStorage.setItem('ui_theme', id); } catch(e){}
}

function renderThemePanel(){
  const cur = localStorage.getItem('ui_theme') || 'default';
  const panel = $('#themePanel');
  panel.innerHTML = '';
  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.className = 'theme-item' + (t.id === cur ? ' active' : '');
    b.innerHTML = '<span class="theme-swatch"><i style="background:' + t.colors[0] + '"></i><i style="background:' + t.colors[1] + '"></i></span><span>' + t.name + '</span>';
    b.addEventListener('click', () => {
      applyTheme(t.id);
      renderThemePanel();
      $('#themePanel').classList.add('hidden');
    });
    panel.appendChild(b);
  });
}

function toggleThemePanel(){
  renderThemePanel();
  $('#themePanel').classList.toggle('hidden');
}

function startOptions(next){
  fetchOptions({next: next});
}

async function upload(){
  const input = $('#fileInput');
  const file = input.files[0];
  if (!file) return;
  addMsg('📎 ' + file.name, 'user');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/api/upload', {method: 'POST', body: fd});
    const d = await safeJson(r);
    if (!d) { addMsg('❌ 服务器响应异常（状态码 ' + r.status + '），可能处理超时，请稍后重试', 'bot'); return; }
    if (r.status === 401) { showLogin(); return; }
    if (!d.ok || !d.task_id) { addMsg('❌ ' + (d.error || '上传失败'), 'bot'); return; }
    const result = await pollTask(d.task_id);
    if (result) addMsg(result.reply, 'bot');
  } catch (e) {
    addMsg('❌ 网络错误：' + e.message, 'bot');
  }
  input.value = '';
}

async function init(){
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    if (s.need_login && !s.authed) showLogin(); else showApp();
  } catch (e) { showLogin(); }
  applyTheme(localStorage.getItem('ui_theme') || 'default');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
}

$('#loginBtn').addEventListener('click', async () => {
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: $('#password').value})
  });
  if (r.ok) showApp(); else alert('密码错误');
});
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });
$('#send').addEventListener('click', send);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('#themeBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleThemePanel();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#themePanel') && !e.target.closest('#themeBtn')) $('#themePanel').classList.add('hidden');
});
$('#attach').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', upload);
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', {method: 'POST'}); showLogin(); });

function renderSidebar(){
  const nav = $('#sidebarNav');
  if (!nav) return;
  nav.innerHTML = '';
  const groupNames = {study: '学习', materials: '资料', more: '更多'};
  Object.keys(MENU).forEach(group => {
    const label = document.createElement('div');
    label.className = 'sidebar-group';
    label.textContent = groupNames[group] || group;
    nav.appendChild(label);
    MENU[group].forEach(item => {
      const b = document.createElement('button');
      b.className = 'sidebar-item';
      b.textContent = item.label;
      b.addEventListener('click', () => {
        if (item.action === 'upload'){ $('#fileInput').click(); return; }
        if (item.next){ startOptions(item.next); return; }
        runChat(item.cmd);
      });
      nav.appendChild(b);
    });
  });
}
renderSidebar();

let activeGroup = null;

function hideSubmenu(){
  activeGroup = null;
  $('#submenu').classList.add('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.remove('active'));
}

function showSubmenu(group){
  activeGroup = group;
  const box = $('#submenu');
  box.innerHTML = '';
  MENU[group].forEach(item => {
    const b = document.createElement('button');
    b.textContent = item.label;
    b.addEventListener('click', () => {
      hideSubmenu();
      if (item.action === 'upload'){ $('#fileInput').click(); return; }
      if (item.next){ startOptions(item.next); return; }
      runChat(item.cmd);
    });
    box.appendChild(b);
  });
  box.classList.remove('hidden');
  document.querySelectorAll('.wbtn').forEach(w => w.classList.toggle('active', w.dataset.group === group));
}

document.querySelectorAll('.wbtn').forEach(w => w.addEventListener('click', (e) => {
  e.stopPropagation();
  const g = w.dataset.group;
  if (activeGroup === g){ hideSubmenu(); } else { showSubmenu(g); }
}));
document.addEventListener('click', (e) => {
  if (!e.target.closest('#submenu') && !e.target.closest('.wbar')) hideSubmenu();
});

init();
