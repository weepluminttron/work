services:
  study-agent:
    build: .
    image: study-agent:latest
    container_name: study-agent
    restart: unless-stopped
    ports:
      - "8080:8080"   # 飞书机器人回调
      - "8090:8090"   # 网页版学习助手
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
    volumes:
      - study-data:/app/data
      - model-cache:/root/.cache

volumes:
  study-data:
  model-cache:
